name: homebrew

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to bump (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-formula:
    name: update homebrew formula
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag=$INPUT_TAG_NAME
          elif [[ -n "$WORKFLOW_RUN_HEAD_BRANCH" ]]; then
            tag=$WORKFLOW_RUN_HEAD_BRANCH
          else
            tag=$(git ls-remote --tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "v*" | awk -v sha="$WORKFLOW_RUN_HEAD_SHA" '
              $1 == sha {
                ref = $2
                sub(/\^\{\}$/, "", ref)
                sub(/^refs\/tags\//, "", ref)
                if (ref ~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/) {
                  print ref
                  exit
                }
              }
            ')
            if [ -z "$tag" ]; then
              echo "::notice::No stable SemVer tag found for the completed release; skipping Homebrew update."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Homebrew tags must use stable SemVer format (for example, v1.2.3 or v1.2.3+build.1)."
            exit 1
          fi
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Download sha256 files
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            gh release download "$TAG" \
              --repo jdblackstar/pin \
              --pattern "pin_${TAG}_${target}.tar.gz.sha256"
          done

      - name: Read checksums
        if: steps.tag.outputs.skip != 'true'
        id: sha
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            key=$(echo "$target" | tr '-' '_')
            hash=$(awk '{print $1}' "pin_${TAG}_${target}.tar.gz.sha256")
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid SHA-256 checksum for ${target}."
              exit 1
            fi
            echo "${key}=${hash}" >> "$GITHUB_OUTPUT"
          done

      - name: Generate formula
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.value }}
          SHA_AARCH64_APPLE_DARWIN: ${{ steps.sha.outputs.aarch64_apple_darwin }}
          SHA_X86_64_APPLE_DARWIN: ${{ steps.sha.outputs.x86_64_apple_darwin }}
          SHA_X86_64_UNKNOWN_LINUX_MUSL: ${{ steps.sha.outputs.x86_64_unknown_linux_musl }}
          SHA_AARCH64_UNKNOWN_LINUX_MUSL: ${{ steps.sha.outputs.aarch64_unknown_linux_musl }}
        run: |
          version="${TAG#v}"
          cat > pin.rb <<FORMULA
          class Pin < Formula
            desc "Small release manager for local tools"
            homepage "https://github.com/jdblackstar/pin"
            license "MIT"
            version "${version}"

            on_macos do
              on_arm do
                url "https://github.com/jdblackstar/pin/releases/download/${TAG}/pin_${TAG}_aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_APPLE_DARWIN}"
              end
              on_intel do
                url "https://github.com/jdblackstar/pin/releases/download/${TAG}/pin_${TAG}_x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_APPLE_DARWIN}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/jdblackstar/pin/releases/download/${TAG}/pin_${TAG}_x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_X86_64_UNKNOWN_LINUX_MUSL}"
              end
              on_arm do
                url "https://github.com/jdblackstar/pin/releases/download/${TAG}/pin_${TAG}_aarch64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_AARCH64_UNKNOWN_LINUX_MUSL}"
              end
            end

            def install
              bin.install "pin"
            end

            test do
              system bin/"pin", "--version"
            end
          end
          FORMULA

      - name: Push to homebrew-tap
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          version="${TAG#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jdblackstar/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp pin.rb tap/Formula/pin.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pin.rb
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "pin ${version}"
          git push origin HEAD:main
