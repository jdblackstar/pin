name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release_ref.outputs.value }}
    steps:
      - name: Validate release ref
        id: release_ref
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ $semver ]]; then
              echo "::error::Release tags must use strict SemVer format (for example, v1.2.3 or v1.2.3-rc.1)."
              exit 1
            fi
          elif [[ ! "$REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Manual build refs must contain only letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          printf 'value=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Test
        run: go test ./...

  build-macos:
    name: macos ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_REF: ${{ needs.quality.outputs.release_ref }}
        run: |
          mkdir -p dist
          version="${RELEASE_REF#v}"
          go build -trimpath -ldflags "-s -w -X github.com/jdblackstar/pin/app.version=${version}" -o "dist/pin" .
      - name: Package
        env:
          RELEASE_REF: ${{ needs.quality.outputs.release_ref }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="pin_${RELEASE_REF}_${TARGET}.tar.gz"
          tar -C dist -czf "${archive}" pin
          ARCHIVE="${archive}" python3 - <<'PY'
          import hashlib
          import os
          import pathlib

          archive = pathlib.Path(os.environ["ARCHIVE"])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          out = archive.with_name(archive.name + ".sha256")
          out.write_text(f"{digest}  {archive.name}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            pin_${{ needs.quality.outputs.release_ref }}_${{ matrix.target }}.tar.gz
            pin_${{ needs.quality.outputs.release_ref }}_${{ matrix.target }}.tar.gz.sha256

  build-linux:
    name: linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_REF: ${{ needs.quality.outputs.release_ref }}
        run: |
          mkdir -p dist
          version="${RELEASE_REF#v}"
          go build -trimpath -ldflags "-s -w -X github.com/jdblackstar/pin/app.version=${version}" -o "dist/pin" .
      - name: Package
        env:
          RELEASE_REF: ${{ needs.quality.outputs.release_ref }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="pin_${RELEASE_REF}_${TARGET}.tar.gz"
          tar -C dist -czf "${archive}" pin
          ARCHIVE="${archive}" python3 - <<'PY'
          import hashlib
          import os
          import pathlib

          archive = pathlib.Path(os.environ["ARCHIVE"])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          out = archive.with_name(archive.name + ".sha256")
          out.write_text(f"{digest}  {archive.name}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            pin_${{ needs.quality.outputs.release_ref }}_${{ matrix.target }}.tar.gz
            pin_${{ needs.quality.outputs.release_ref }}_${{ matrix.target }}.tar.gz.sha256

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - quality
      - build-macos
      - build-linux
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.quality.outputs.release_ref }}
          generate_release_notes: true
          files: |
            dist/**/pin_*.tar.gz*
